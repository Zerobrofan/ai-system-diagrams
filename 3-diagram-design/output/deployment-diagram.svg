<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dep-title dep-desc" id="deployment-diagram-root">
        <title id="dep-title">MedPulse Hospital · Production Infrastructure</title>
        <desc id="dep-desc">Deployment diagram showing client edge devices connecting through Cloudflare WAF into an EKS Kubernetes cluster communicating over gRPC to microservice pods and private encrypted PostgreSQL, Redis, and S3 tiers.</desc>
        
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #deployment-diagram-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #deployment-diagram-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deployment-diagram-root .diagram-container { width: 100%; overflow-x: auto; }</style>
          <pattern id="deployment-diagram-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.09"/>
          </pattern>
          <marker id="deployment-diagram-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="deployment-diagram-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="deployment-diagram-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#deployment-diagram-dots)" opacity="0.6"/>

        <!-- ZONE 1: CLIENT EDGE DEVICES -->
        <rect x="30" y="40" width="190" height="560" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="42" y="32" width="105" height="16" rx="3" fill="#f5f5f5"/>
        <text x="94" y="43" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" fill-opacity="0.55">CLIENT TIER</text>

        <!-- ZONE 2: EDGE & DMZ -->
        <rect x="250" y="40" width="170" height="560" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="262" y="32" width="125" height="16" rx="3" fill="#f5f5f5"/>
        <text x="324" y="43" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" fill-opacity="0.55">EDGE / CLOUDFLARE</text>

        <!-- ZONE 3: COMPUTE (KUBERNETES) -->
        <rect x="450" y="40" width="310" height="560" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="462" y="32" width="145" height="16" rx="3" fill="#f5f5f5"/>
        <text x="534" y="43" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" fill-opacity="0.55">PROD K8S CLUSTER</text>

        <!-- ZONE 4: DATA / PRIVATE STORAGE -->
        <rect x="790" y="40" width="300" height="340" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="802" y="32" width="135" height="16" rx="3" fill="#f5f5f5"/>
        <text x="869" y="43" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" fill-opacity="0.55">DATA TIER / VPC</text>

        <!-- ZONE 5: EXTERNAL SAAS -->
        <rect x="790" y="400" width="300" height="200" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.02" stroke-opacity="0.20"/>
        <rect x="802" y="392" width="145" height="16" rx="3" fill="#f5f5f5"/>
        <text x="874" y="403" fill="#2d3142" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" fill-opacity="0.55">EXTERNAL HEALTH APIS</text>

        <!-- NETWORK PATHS (Drawn behind nodes) -->
        <!-- Client Devices -> Cloudflare WAF -->
        <path d="M 195,115 H 275" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>
        <path d="M 195,245 H 230 Q 238,245 238,235 V 135 Q 238,125 246,125 H 275" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>
        <path d="M 195,380 H 220 Q 228,380 228,370 V 305 Q 228,295 236,295 H 275" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow)"/>

        <!-- WAF -> Traefik Ingress -->
        <path d="M 395,120 H 475" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>
        <!-- Ingress -> Spring Gateway -->
        <line x1="595" y1="120" x2="595" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow)"/>

        <!-- Spring Gateway -> Microservices (gRPC) -->
        <path d="M 595,215 V 240 Q 595,248 585,248 H 530 Q 520,248 520,256 V 265" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-accent)"/>
        <path d="M 595,215 V 360 Q 595,368 585,368 H 530 Q 520,368 520,376 V 385" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-accent)"/>
        <path d="M 595,215 V 480 Q 595,488 585,488 H 530 Q 520,488 520,496 V 505" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-accent)"/>

        <!-- EHR Service -> PostgreSQL Primary & S3 Scans -->
        <path d="M 720,295 H 770 Q 778,295 778,285 V 125 Q 778,115 786,115 H 815" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>
        <path d="M 720,295 H 760 Q 768,295 768,285 V 295 Q 768,295 786,295 H 815" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow)"/>

        <!-- Appointment Service -> PostgreSQL Primary & Replica -->
        <path d="M 720,415 H 775 Q 783,415 783,405 V 205 Q 783,195 791,195 H 815" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow)"/>

        <!-- PostgreSQL Primary to Replica (Streaming WAL) -->
        <line x1="935" y1="140" x2="935" y2="175" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#deployment-diagram-arrow-accent)"/>

        <!-- Billing Service -> External Insurance FHIR & Stripe -->
        <path d="M 720,535 H 815" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>

        <!-- PATH LABELS -->
        <rect x="210" y="107" width="55" height="12" rx="2" fill="#f5f5f5"/>
        <text x="237" y="116" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">HTTPS:443</text>

        <rect x="415" y="112" width="45" height="12" rx="2" fill="#f5f5f5"/>
        <text x="437" y="121" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">mTLS</text>

        <rect x="600" y="132" width="55" height="12" rx="2" fill="#f5f5f5"/>
        <text x="627" y="141" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:8080</text>

        <rect x="540" y="240" width="55" height="12" rx="2" fill="#f5f5f5"/>
        <text x="567" y="249" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">gRPC:50051</text>

        <rect x="745" y="107" width="55" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="116" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">JDBC:5432</text>

        <rect x="745" y="527" width="55" height="12" rx="2" fill="#f5f5f5"/>
        <text x="772" y="536" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">FHIR:HTTPS</text>

        <rect x="945" y="150" width="45" height="12" rx="2" fill="#f5f5f5"/>
        <text x="967" y="159" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">WAL REP</text>


        <!-- ZONE 1 NODES: CLIENTS -->
        <!-- Node: Mobile App -->
        <g id="node-mobile">
          <rect x="45" y="85" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <circle cx="58" cy="98" r="3" fill="#10b981"/>
          <text x="68" y="101" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Patient Mobile App</text>
          <text x="58" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Flutter 3.x / iOS·Android</text>
          <text x="58" y="132" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace">TLS 1.3 · Certificate Pin</text>
        </g>

        <!-- Node: Web Portal -->
        <g id="node-web">
          <rect x="45" y="215" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <circle cx="58" cy="228" r="3" fill="#10b981"/>
          <text x="68" y="231" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Clinical EHR Web</text>
          <text x="58" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">React 19 / TypeScript</text>
          <text x="58" y="262" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace">WSS WebSocket Live</text>
        </g>

        <!-- Node: Bedside IoT -->
        <g id="node-iot">
          <rect x="45" y="350" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <circle cx="58" cy="363" r="3" fill="#10b981"/>
          <text x="68" y="366" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Bedside Vitals Hub</text>
          <text x="58" y="383" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Embedded Linux / Rust</text>
          <text x="58" y="397" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">MQTTS : 8883 Telemetry</text>
        </g>

        <!-- ZONE 2 NODES: EDGE -->
        <g id="node-waf">
          <rect x="275" y="85" width="120" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="335" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Edge</text>
          <text x="335" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WAF &amp; DDoS Shield</text>
          <text x="335" y="140" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Anycast SSL Offload</text>
        </g>

        <g id="node-mqtt-gw">
          <rect x="275" y="265" width="120" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="335" y="288" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EMQX Broker</text>
          <text x="335" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">IoT Telemetry Ingress</text>
        </g>

        <!-- ZONE 3 NODES: COMPUTE (K8S) -->
        <g id="node-ingress">
          <rect x="475" y="85" width="240" height="45" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="595" y="106" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traefik Ingress Controller</text>
          <text x="595" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Internal Routing &amp; Rate Limiting</text>
        </g>

        <g id="node-apigw">
          <rect x="475" y="160" width="240" height="55" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
          <text x="595" y="182" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spring Cloud Gateway (x3)</text>
          <text x="595" y="198" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Token Verification · gRPC Dispatcher</text>
        </g>

        <g id="node-ehr-svc">
          <rect x="475" y="265" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="490" y="286" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Pod: EHR Clinical Service (x4)</text>
          <text x="490" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Spring Boot 3.3 · Java 21 LTS</text>
          <text x="490" y="316" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace">FHIR v4 Core Engine</text>
        </g>

        <g id="node-appt-svc">
          <rect x="475" y="385" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="490" y="406" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Pod: Scheduling Service (x3)</text>
          <text x="490" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Go 1.23 / Gin Engine</text>
          <text x="490" y="436" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace">Optimistic Lock Slot Allocator</text>
        </g>

        <g id="node-billing-svc">
          <rect x="475" y="505" width="240" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="490" y="526" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Pod: Billing &amp; Claims (x2)</text>
          <text x="490" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Python 3.12 / FastAPI Async</text>
          <text x="490" y="556" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace">Async Claims Pipeline</text>
        </g>

        <!-- ZONE 4 NODES: DATA TIER -->
        <g id="node-pg-primary">
          <rect x="815" y="85" width="240" height="55" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <circle cx="830" cy="98" r="3" fill="#10b981"/>
          <text x="840" y="101" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL 16 Primary (R/W)</text>
          <text x="840" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HIPAA-Compliant AES-256 at Rest</text>
          <text x="840" y="131" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace">Port: 5432 · Connection Pool (PgBouncer)</text>
        </g>

        <g id="node-pg-replica">
          <rect x="815" y="175" width="240" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <circle cx="830" cy="188" r="3" fill="#38bdf8"/>
          <text x="840" y="191" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">PostgreSQL Standby Replica</text>
          <text x="840" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Read-Only Analytics &amp; Reports</text>
        </g>

        <g id="node-redis">
          <rect x="815" y="260" width="115" height="55" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="872" y="280" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis 7 Cluster</text>
          <text x="872" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">JWT Tokens &amp; Cache</text>
        </g>

        <g id="node-s3">
          <rect x="940" y="260" width="115" height="55" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="997" y="280" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MinIO / S3 Encrypted</text>
          <text x="997" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DICOM Scan Scans</text>
        </g>

        <!-- ZONE 5 NODES: EXTERNAL SAAS -->
        <g id="node-ins">
          <rect x="815" y="435" width="240" height="45" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
          <text x="830" y="454" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Insurance Clearinghouse</text>
          <text x="830" y="469" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace">REST / HL7 FHIR Claims API</text>
        </g>

        <g id="node-stripe">
          <rect x="815" y="495" width="240" height="45" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="830" y="514" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Stripe Payment Gateway</text>
          <text x="830" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PCI-DSS Level 1 Secure Tokens</text>
        </g>

        <!-- BOTTOM LEGEND -->
        <g id="legend" transform="translate(45, 625)">
          <text x="0" y="10" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INFRASTRUCTURE LEGEND:</text>
          
          <rect x="150" y="2" width="10" height="10" rx="2" fill="#10b981"/>
          <text x="166" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">High Availability Node</text>

          <line x1="280" y1="7" x2="310" y2="7" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-link)"/>
          <text x="318" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Encrypted Public / Ingress Path (TLS)</text>

          <line x1="490" y1="7" x2="520" y2="7" stroke="#bf4520" stroke-width="1.2" marker-end="url(#deployment-diagram-arrow-accent)"/>
          <text x="528" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Internal gRPC Service Mesh / Replication</text>
        </g>

      </svg>
