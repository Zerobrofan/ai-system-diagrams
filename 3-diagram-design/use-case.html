<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPulse Hospital · Use Case Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1240px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.5vw + 0.8rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1020px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">System Boundary &amp; Actors · Diagram Design · Created by Eng. Abdallah Amir</p>
    <h1>MedPulse Hospital · Use Case Model</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uc-title uc-desc">
        <title id="uc-title">MedPulse Hospital · Use Case Architecture</title>
        <desc id="uc-desc">Editorial use case diagram showcasing primary clinical and patient actors interacting with the MedPulse Hospital system boundary, including authentication prerequisites and insurance claim extensions.</desc>
        
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.09)"/>
          </pattern>
          <marker id="arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
          <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#bf4520" stroke-width="1"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- SYSTEM BOUNDARY -->
        <rect x="230" y="40" width="580" height="580" rx="10" fill="#ffffff" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
        <!-- System Boundary Header Tag -->
        <rect x="246" y="28" width="260" height="22" rx="4" fill="#2d3142"/>
        <text x="376" y="42" fill="#ffffff" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MEDPULSE SYSTEM BOUNDARY</text>

        <!-- CONNECTOR LINES (Drawn behind boxes) -->
        <!-- Patient to Use Cases -->
        <path d="M 170,110 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,110 H 220 Q 228,110 228,118 V 192 Q 228,200 236,200 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,110 H 210 Q 218,110 218,118 V 282 Q 218,290 226,290 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,110 H 200 Q 208,110 208,118 V 462 Q 208,470 216,470 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>

        <!-- Doctor to Use Cases -->
        <path d="M 170,250 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,250 H 230 Q 238,250 238,258 V 372 Q 238,380 246,380 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,250 H 240 Q 248,250 248,258 V 285 Q 248,290 256,290 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>

        <!-- Nurse to Use Cases -->
        <path d="M 170,390 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,390 H 225 Q 233,390 233,382 V 295 Q 233,290 241,290 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>

        <!-- Admin to Use Cases -->
        <path d="M 170,540 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
        <path d="M 170,540 H 240 Q 248,540 248,548 V 575 Q 248,580 256,580 H 280" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>

        <!-- <<include>> Book Appt -> Verify Identity -->
        <line x1="510" y1="200" x2="580" y2="200" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <!-- <<include>> View Records -> Verify Identity -->
        <path d="M 510,290 H 540 Q 548,290 548,282 V 212 Q 548,204 556,204 H 580" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <!-- <<include>> Prescribe -> Drug Interaction Check -->
        <line x1="510" y1="380" x2="580" y2="380" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- <<extend>> Telehealth -> Book Appt -->
        <path d="M 695,140 V 162 Q 695,170 687,170 H 420 Q 412,170 412,178 V 180" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>

        <!-- <<extend>> Insurance Claim -> Settle Bill -->
        <line x1="510" y1="470" x2="580" y2="470" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>

        <!-- Insurance Claim -> Insurance Provider (Secondary Actor) -->
        <line x1="790" y1="470" x2="880" y2="470" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-open)"/>

        <!-- CONNECTOR LABELS -->
        <rect x="525" y="193" width="46" height="13" rx="2" fill="#ffffff"/>
        <text x="548" y="202" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">«include»</text>

        <rect x="525" y="373" width="46" height="13" rx="2" fill="#ffffff"/>
        <text x="548" y="382" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">«include»</text>

        <rect x="525" y="463" width="46" height="13" rx="2" fill="#ffffff"/>
        <text x="548" y="472" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">«extend»</text>

        <rect x="532" y="163" width="46" height="13" rx="2" fill="#ffffff"/>
        <text x="555" y="172" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">«extend»</text>

        <rect x="806" y="463" width="58" height="13" rx="2" fill="#f5f5f5"/>
        <text x="835" y="472" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">SUBMITS</text>

        <!-- PRIMARY ACTORS (LEFT) -->
        <!-- Patient -->
        <rect x="40" y="85" width="130" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="105" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Patient</text>
        <text x="52" y="122" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">PRIMARY USER</text>

        <!-- Doctor -->
        <rect x="40" y="225" width="130" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="245" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Doctor</text>
        <text x="52" y="262" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">CLINICIAN</text>

        <!-- Nurse -->
        <rect x="40" y="365" width="130" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="385" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Nurse</text>
        <text x="52" y="402" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">CARE STAFF</text>

        <!-- Admin -->
        <rect x="40" y="515" width="130" height="50" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="535" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Hospital Admin</text>
        <text x="52" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">OPERATIONS</text>

        <!-- USE CASE NODES (CENTER COLUMN) -->
        <!-- Register & Authenticate -->
        <g id="uc-auth">
          <rect x="280" y="90" width="230" height="40" rx="20" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="114" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Register &amp; Account Login</text>
        </g>

        <!-- Book Appointment -->
        <g id="uc-book">
          <rect x="280" y="180" width="230" height="40" rx="20" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="204" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Book Doctor Consultation</text>
        </g>

        <!-- View Records & EHR -->
        <g id="uc-view-ehr">
          <rect x="280" y="270" width="230" height="40" rx="20" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="294" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">View Health Records &amp; Labs</text>
        </g>

        <!-- Prescribe Medication -->
        <g id="uc-prescribe">
          <rect x="280" y="360" width="230" height="40" rx="20" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="384" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Issue Digital Prescription</text>
        </g>

        <!-- Settle Bill -->
        <g id="uc-settle-bill">
          <rect x="280" y="450" width="230" height="40" rx="20" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="474" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Settle Hospital Invoice</text>
        </g>

        <!-- Manage Staff -->
        <g id="uc-manage-staff">
          <rect x="280" y="525" width="230" height="36" rx="18" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="547" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Manage Staff &amp; Shifts</text>
        </g>

        <!-- Audit Logs -->
        <g id="uc-audit-logs">
          <rect x="280" y="565" width="230" height="36" rx="18" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="395" y="587" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Regulatory Audit Logs</text>
        </g>

        <!-- EXTENDED / INCLUDED NODES (RIGHT COLUMN) -->
        <!-- Telehealth (Extended) -->
        <g id="uc-telehealth">
          <rect x="580" y="100" width="210" height="40" rx="20" fill="rgba(79,93,117,0.06)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3"/>
          <text x="685" y="124" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Select Telehealth Video</text>
        </g>

        <!-- Verify Identity (Included) -->
        <g id="uc-mfa">
          <rect x="580" y="180" width="210" height="40" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="685" y="204" fill="#bf4520" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Verify Identity &amp; 2FA</text>
        </g>

        <!-- Drug Interaction Check (Included) -->
        <g id="uc-drugcheck">
          <rect x="580" y="360" width="210" height="40" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="685" y="384" fill="#bf4520" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Cross-Check Drug Allergies</text>
        </g>

        <!-- Claim Insurance (Extended) -->
        <g id="uc-claim">
          <rect x="580" y="450" width="210" height="40" rx="20" fill="#fcfcfc" stroke="#2e5aa8" stroke-width="1"/>
          <text x="685" y="474" fill="#2e5aa8" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="500">Claim Insurance Coverage</text>
        </g>

        <!-- SECONDARY ACTOR (RIGHT) -->
        <rect x="880" y="445" width="140" height="50" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="892" y="466" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Insurance GW</text>
        <text x="892" y="483" fill="#2e5aa8" font-size="8.5" font-family="'Geist Mono', monospace">FHIR / HL7 REST</text>

        <!-- BOTTOM LEGEND -->
        <g id="legend" transform="translate(40, 635)">
          <text x="0" y="10" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">LEGEND:</text>
          
          <rect x="60" y="1" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="80" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Primary Actor</text>

          <rect x="170" y="1" width="18" height="10" rx="5" fill="#fcfcfc" stroke="#4f5d75" stroke-width="1"/>
          <text x="194" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Core Use Case</text>

          <rect x="290" y="1" width="18" height="10" rx="5" fill="rgba(191,69,32,0.1)" stroke="#bf4520" stroke-width="1"/>
          <text x="314" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Mandatory «include»</text>

          <rect x="440" y="1" width="18" height="10" rx="5" fill="rgba(79,93,117,0.06)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3"/>
          <text x="464" y="10" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Optional «extend»</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
